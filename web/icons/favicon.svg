<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="pothika-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="pothika-glow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="pothika-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#10B981" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="18" fill="url(#pothika-bg)"/>
  <rect x="1" y="1" width="62" height="62" rx="17" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <!-- Safety shield / Lotus petal path motif -->
  <path d="M32 10C32 10 46 14 48 26C50 38 38 48 32 54C26 48 14 38 16 26C18 14 32 10 32 10Z" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  <!-- Glowing safe path S-curve -->
  <path d="M22 44C22 34 42 34 42 20" stroke="url(#pothika-glow)" stroke-width="4.5" stroke-linecap="round" filter="url(#pothika-shadow)"/>
  <!-- Origin beacon -->
  <circle cx="22" cy="44" r="3.5" fill="#10B981" stroke="#FFFFFF" stroke-width="1.8"/>
  <!-- Safe destination glow -->
  <circle cx="42" cy="20" r="5" fill="#F59E0B" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="42" cy="20" r="2" fill="#0F172A"/>
  <!-- Guidance stars/sparks -->
  <circle cx="20" cy="18" r="1.5" fill="#38BDF8" opacity="0.8"/>
  <circle cx="46" cy="42" r="1.2" fill="#34D399" opacity="0.8"/>
</svg>