<!doctype html>
<html lang="bn" data-theme="day">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>পথিকা · নারীদের জন্য নিরাপদ পথ</title>
  <meta name="description" content="পথিকা: ঢাকায় নারীদের জন্য নিরাপদ হাঁটার পথ বেছে নেওয়ার পরীক্ষামূলক টুল। Pothika: experimental safe-routing tool for women walking in Dhaka.">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#14213d"/><path d="M17 48C17 29 47 37 47 18" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/><circle cx="17" cy="48" r="3.4" fill="#fff"/><circle cx="47" cy="18" r="5.2" fill="#ffc857"/><circle cx="47" cy="18" r="1.9" fill="#14213d"/></svg>
      <div class="brand-text">
        <h1 data-i18n="app.title">পথিকা</h1>
        <span class="brand-sub" data-i18n="app.tagline">নারীদের জন্য নিরাপদ পথ</span>
      </div>
    </div>
    <div class="top-actions">
      <button id="btn-lang" class="chip" type="button"></button>
      <button id="btn-about" class="icon-btn" type="button" data-i18n-aria="about.open">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
      </button>
    </div>
  </header>

  <button id="banner" class="banner" type="button">
    <span class="banner-in"><span><span data-i18n="banner"></span> <u data-i18n="banner.more"></u></span></span>
  </button>

  <main class="main">
    <div id="map" data-i18n-aria="map.aria"></div>

    <section id="sheet" class="sheet" aria-label="Route planner">
      <button id="btn-sheet" class="sheet-handle" type="button" aria-expanded="true">
        <span class="handle-bar" aria-hidden="true"></span>
        <span class="visually-hidden" id="sheet-label"></span>
      </button>

      <div class="sheet-top">
        <p id="hint" class="hint" role="status" aria-live="polite"></p>
        <div class="planner">
          <div class="fields">
            <div class="field-wrap">
              <div class="field">
                <span class="field-pin" aria-hidden="true">A</span>
                <label class="visually-hidden" for="q-o" data-i18n="field.from"></label>
                <input id="q-o" type="text" role="combobox" aria-expanded="false" aria-autocomplete="list" aria-controls="sg-o" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" data-i18n-ph="field.from.ph">
                <button id="clr-o" class="field-clear" type="button" hidden data-i18n-aria="field.clear" data-i18n-title="field.clear"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
              </div>
              <ul id="sg-o" class="suggest" role="listbox" hidden></ul>
            </div>
            <div class="field-wrap">
              <div class="field">
                <span class="field-pin" aria-hidden="true">B</span>
                <label class="visually-hidden" for="q-d" data-i18n="field.to"></label>
                <input id="q-d" type="text" role="combobox" aria-expanded="false" aria-autocomplete="list" aria-controls="sg-d" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" data-i18n-ph="field.to.ph">
                <button id="clr-d" class="field-clear" type="button" hidden data-i18n-aria="field.clear" data-i18n-title="field.clear"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
              </div>
              <ul id="sg-d" class="suggest" role="listbox" hidden></ul>
            </div>
          </div>
          <button id="btn-swap" type="button" class="icon-btn" data-i18n-aria="btn.swap" data-i18n-title="btn.swap">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4v14M7 18l-3-3M7 18l3-3M17 20V6M17 6l-3 3M17 6l3 3"/></svg>
          </button>
        </div>
        <p id="sg-status" class="visually-hidden" role="status" aria-live="polite"></p>
        <div class="seg" role="group" aria-labelledby="time-label">
          <span id="time-label" class="seg-label" data-i18n="time.label"></span>
          <div class="seg-track">
          <button id="t-day" type="button" class="seg-btn" data-night="0">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg>
            <span data-i18n="time.day"></span>
          </button>
          <button id="t-night" type="button" class="seg-btn" data-night="1">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
            <span data-i18n="time.night"></span>
          </button>
          </div>
        </div>
      </div>

      <div class="sheet-body" id="sheet-body">
        <div class="row">
          <button id="btn-loc" type="button" class="btn">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3"/></svg>
            <span data-i18n="btn.loc"></span>
          </button>
          <button id="btn-reset" type="button" class="icon-btn" data-i18n-aria="btn.reset" data-i18n-title="btn.reset">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4v6h6M4.6 10A8 8 0 1 1 6 16.5"/></svg>
          </button>
        </div>
        <p class="note" data-i18n="loc.note"></p>

        <div id="routes-box" hidden>
          <h2 class="h2" data-i18n="routes.title"></h2>
          <p id="no-alt" class="note" hidden data-i18n="route.noAlt"></p>
          <ul id="routes" class="routes"></ul>
        </div>
        <p id="route-msg" class="msg" role="status" hidden></p>

        <div class="tools">
          <button id="btn-report" type="button" class="btn btn-quiet" aria-pressed="false">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>
            <span id="report-label"></span>
          </button>
          <button id="btn-mine" type="button" class="btn btn-quiet">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 6h14M5 12h14M5 18h9"/></svg>
            <span id="mine-label"></span>
          </button>
        </div>

        <details class="layers">
          <summary><span data-i18n="tools.layers"></span></summary>
          <label class="check"><input type="checkbox" id="ly-risk"> <span data-i18n="layers.risk"></span></label>
          <div id="risk-legend" class="legend" hidden aria-hidden="true">
            <span data-i18n="layers.low"></span>
            <i style="background:var(--rk1)"></i><i style="background:var(--rk2)"></i><i style="background:var(--rk3)"></i><i style="background:var(--rk4)"></i><i style="background:var(--rk5)"></i>
            <span data-i18n="layers.high"></span>
          </div>
          <label class="check"><input type="checkbox" id="ly-police" checked> <span data-i18n="layers.police"></span></label>
          <label class="check"><input type="checkbox" id="ly-hospital"> <span data-i18n="layers.hospital"></span></label>
        </details>
      </div>
    </section>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </main>
</div>

<dialog id="dlg-report" aria-labelledby="rep-title">
  <form method="dialog" class="dlg-inner">
    <h2 id="rep-title" data-i18n="rep.title"></h2>
    <p id="rep-street" class="street"></p>
    <p id="rep-stretch" class="note"></p>
    <div class="kinds">
      <button type="button" class="kind" data-kind="lit"><span class="kind-ico k-lit" aria-hidden="true"></span><span data-i18n="rep.lit"></span></button>
      <button type="button" class="kind" data-kind="dark"><span class="kind-ico k-dark" aria-hidden="true"></span><span data-i18n="rep.dark"></span></button>
      <button type="button" class="kind" data-kind="unsafe"><span class="kind-ico k-unsafe" aria-hidden="true"></span><span data-i18n="rep.unsafe"></span></button>
    </div>
    <div class="seg seg-inline" role="group" aria-labelledby="rep-when-l">
      <span id="rep-when-l" class="seg-label" data-i18n="rep.when"></span>
      <div class="seg-track">
        <button type="button" class="seg-btn" data-when="day"><span data-i18n="time.day"></span></button>
        <button type="button" class="seg-btn" data-when="night"><span data-i18n="time.night"></span></button>
      </div>
    </div>
    <p class="note" data-i18n="rep.privacy"></p>
    <div class="dlg-actions"><button class="btn btn-quiet" value="cancel" data-i18n="dlg.cancel"></button></div>
  </form>
</dialog>

<dialog id="dlg-mine" aria-labelledby="mine-title">
  <form method="dialog" class="dlg-inner">
    <h2 id="mine-title" data-i18n="mine.title"></h2>
    <p class="note" data-i18n="mine.note"></p>
    <ul id="mine-list" class="mine-list"></ul>
    <div class="dlg-actions">
      <button type="button" id="btn-export" class="btn btn-quiet" data-i18n="mine.export"></button>
      <button class="btn" value="close" data-i18n="dlg.close"></button>
    </div>
  </form>
</dialog>

<dialog id="dlg-about" aria-labelledby="about-title">
  <form method="dialog" class="dlg-inner">
    <h2 id="about-title" data-i18n="about.title"></h2>
    <div id="about-body" class="about"></div>
    <div class="dlg-actions"><button class="btn" value="close" data-i18n="dlg.close"></button></div>
  </form>
</dialog>

<noscript><p style="padding:16px">এই অ্যাপ চালাতে JavaScript দরকার। This app needs JavaScript.</p></noscript>

<script src="vendor/leaflet/leaflet.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
